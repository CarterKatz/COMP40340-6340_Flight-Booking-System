name: flight-booking

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://airline:airline@db:5432/airline
      API_KEY: dev-key
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata: